<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Наталья Соболь: Астролог-прогнозист, стратегический анализ и натальные карты</title>
  <meta name="description" content="Индивидуальное астрологическое прогнозирование Натальи Соболь. Расчет периодов возможностей, анализ натальной карты, соляр и финансы.">

  <!-- Шрифты: Syne (акцентный заголовочный) + Plus Jakarta Sans (текстовый гротеск) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['Syne', 'sans-serif'],
            script: ['"Playfair Display"', 'serif'],
          },
          colors: {
            ivory: '#F8F7F4',
            graphite: '#1A1E24',
            matteGold: '#C5A069',
            fanfareTeal: '#0C4A52',
            fuchsiaFedora: '#BE1E62',
            blushingBride: '#F4E7E3',
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM через CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone для запуска JSX в браузере -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #F8F7F4;
      color: #1A1E24;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // SVG Иконки Lucide с поддержкой единого стиля
    const CompassIcon = () => (
      <svg className="w-5 h-5 text-matteGold" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="1.8">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
      </svg>
    );

    const TrendingIcon = () => (
      <svg className="w-5 h-5 text-matteGold" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="1.8">
        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
        <polyline points="17 6 23 6 23 12"/>
      </svg>
    );

    const HeartIcon = () => (
      <svg className="w-5 h-5 text-matteGold" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="1.8">
        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
      </svg>
    );

    const SparklesIcon = () => (
      <svg className="w-5 h-5 text-matteGold" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="1.8">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
      </svg>
    );

    const ShieldIcon = () => (
      <svg className="w-5 h-5 text-matteGold" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="1.8">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
      </svg>
    );

    const CalendarIcon = () => (
      <svg className="w-5 h-5 text-matteGold" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="1.8">
        <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
        <line x1="16" x2="16" y1="2" y2="6"/>
        <line x1="8" x2="8" y1="2" y2="6"/>
        <line x1="3" x2="21" y1="10" y2="10"/>
      </svg>
    );

    const StarEight = () => (
      <svg className="w-4 h-4 text-matteGold inline-block" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0L14 9L23 7L17 14L24 19L15 19L12 24L9 19L0 19L7 14L1 7L10 9L12 0Z"/>
      </svg>
    );

    function NataliaSobolApp() {
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [selectedService, setSelectedService] = useState('Стратегический соляр');
      const [categoryFilter, setCategoryFilter] = useState('all');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [formSent, setFormSent] = useState(false);

      const services = [
        {
          id: 'solar',
          category: 'forecast',
          title: 'Стратегический соляр на 12 месяцев',
          tag: 'Флагманский прогноз',
          desc: 'Карта персональных трендов, фокусов внимания и точек роста. Позволяет застраховаться от кризисных периодов и точно рассчитать запуск ключевых проектов.',
          duration: 'Индивидуальный разбор 90 мин + PDF-стратегия',
          price: '35 000 ₽',
          icon: CompassIcon,
          popular: true
        },
        {
          id: 'finance',
          category: 'finance',
          title: 'Деньги, карьера и масштаб',
          tag: 'Бизнес-навигатор',
          desc: 'Анализ персонального финансового кода: через какие ниши приходят деньги, где кроются скрытые блоки и как перестроить модель занятости без выгорания.',
          duration: 'Сессия 75 мин + аудиозапись',
          price: '28 000 ₽',
          icon: TrendingIcon,
          popular: false
        },
        {
          id: 'relations',
          category: 'relations',
          title: 'Отношения и совместимость',
          tag: 'Личная жизнь и партнерство',
          desc: 'Диагностика союза: скрытые триггеры, точки сближения и правила долгосрочного баланса. Подходит как для пар, так и для тех, кто в активном поиске.',
          duration: 'Сессия 75 мин + синастрическая карта',
          price: '25 000 ₽',
          icon: HeartIcon,
          popular: false
        },
        {
          id: 'natal',
          category: 'natal',
          title: 'Натальная карта: ДНК личности',
          tag: 'Фундаментальный разбор',
          desc: 'Глубокий анализ врожденного потенциала, сильных сторон, скрытых ресурсов и зон персональной ответственности. Базовый ключ к себе.',
          duration: 'Консультация 90 мин + памятка-навигатор',
          price: '30 000 ₽',
          icon: SparklesIcon,
          popular: false
        }
      ];

      const filteredServices = categoryFilter === 'all' 
        ? services 
        : services.filter(s => s.category === categoryFilter);

      const handleOpenBooking = (serviceTitle) => {
        if (serviceTitle) setSelectedService(serviceTitle);
        setIsModalOpen(true);
        setFormSent(false);
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        setFormSent(true);
        setTimeout(() => {
          setIsModalOpen(false);
          setFormSent(false);
        }, 2200);
      };

      return (
        <div className="min-h-screen bg-ivory text-graphite antialiased font-sans selection:bg-matteGold/20">
          
          {/* ШАПКА САЙТА */}
          <header className="sticky top-0 z-40 w-full border-b border-graphite/10 bg-ivory/95 backdrop-blur-md">
            <div className="mx-auto flex h-[72px] max-w-6xl items-center justify-between px-6">
              <a href="#" className="flex flex-col group">
                <span className="font-display text-sm tracking-[0.22em] text-graphite font-bold uppercase transition-colors group-hover:text-fanfareTeal">
                  Наталья Соболь
                </span>
                <span className="text-[10px] tracking-[0.18em] text-matteGold uppercase font-semibold">
                  Астролог-прогнозист
                </span>
              </a>

              <nav className="hidden items-center gap-8 md:flex text-xs font-semibold uppercase tracking-[0.14em] text-graphite/70">
                <a href="#about" className="hover:text-graphite transition-colors">О методе</a>
                <a href="#services" className="hover:text-graphite transition-colors">Консультации</a>
                <a href="#quote" className="hover:text-graphite transition-colors">Стратегия</a>
                <a href="#contacts" className="hover:text-graphite transition-colors">Контакты</a>
              </nav>

              <div className="hidden md:flex items-center gap-4">
                <button 
                  onClick={() => handleOpenBooking()}
                  className="rounded-2xl bg-fanfareTeal px-6 py-2.5 text-xs font-semibold uppercase tracking-[0.14em] text-white hover:bg-fanfareTeal/90 transition-all shadow-sm active:scale-95"
                >
                  Записаться
                </button>
              </div>

              <button 
                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                className="md:hidden p-2 text-graphite"
                aria-label="Меню"
              >
                <div className="space-y-1.5 w-6">
                  <span className="block h-0.5 w-6 bg-graphite"></span>
                  <span className="block h-0.5 w-6 bg-graphite"></span>
                  <span className="block h-0.5 w-4 bg-graphite"></span>
                </div>
              </button>
            </div>

            {mobileMenuOpen && (
              <div className="md:hidden border-b border-graphite/10 bg-ivory px-6 py-6 space-y-4">
                <nav className="flex flex-col gap-4 text-xs font-semibold tracking-widest uppercase text-graphite/80">
                  <a href="#about" onClick={() => setMobileMenuOpen(false)}>О методе</a>
                  <a href="#services" onClick={() => setMobileMenuOpen(false)}>Консультации</a>
                  <a href="#quote" onClick={() => setMobileMenuOpen(false)}>Стратегия</a>
                  <a href="#contacts" onClick={() => setMobileMenuOpen(false)}>Контакты</a>
                </nav>
                <button 
                  onClick={() => { setMobileMenuOpen(false); handleOpenBooking(); }}
                  className="w-full rounded-2xl bg-fanfareTeal py-3 text-xs font-semibold uppercase tracking-widest text-white"
                >
                  Записаться
                </button>
              </div>
            )}
          </header>

          <main>
            {/* HERO СЕКЦИЯ */}
            <section className="relative min-h-[calc(100dvh-72px)] flex items-center border-b border-graphite/8 overflow-hidden">
              <div className="mx-auto max-w-6xl w-full px-6 py-10 md:py-16">
                <div className="grid grid-cols-1 gap-10 lg:grid-cols-12 lg:items-center">
                  
                  <div className="lg:col-span-7 flex flex-col items-start space-y-6">
                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-2xl bg-blushingBride text-graphite text-[11px] uppercase tracking-widest font-semibold">
                      <StarEight />
                      Стратегия, время, возможности
                    </div>

                    <h1 className="font-display text-4xl sm:text-5xl lg:text-6xl font-bold leading-[1.08] tracking-tight text-graphite">
                      Видеть перспективу.<br />
                      <span className="text-matteGold">Понимать риски.</span><br />
                      Использовать время.
                    </h1>

                    <p className="max-w-xl text-base sm:text-lg text-graphite/75 leading-relaxed font-normal">
                      Практичные расчеты и навигация по натальной карте для тех, кто принимает взвешенные решения в бизнесе, карьере и семье.
                    </p>

                    <div className="flex flex-wrap items-center gap-4 pt-2">
                      <button 
                        onClick={() => handleOpenBooking()}
                        className="rounded-2xl bg-fanfareTeal px-7 py-3.5 text-xs uppercase font-bold tracking-[0.16em] text-white hover:bg-fanfareTeal/90 transition-all shadow-sm active:scale-95"
                      >
                        Выбрать консультацию
                      </button>
                      <a 
                        href="#services"
                        className="inline-flex items-center gap-2 rounded-2xl border border-graphite/20 bg-white px-6 py-3.5 text-xs uppercase font-bold tracking-[0.16em] text-graphite hover:border-graphite transition-colors"
                      >
                        Смотреть каталог
                      </a>
                    </div>

                    <div className="pt-2 flex items-center gap-6 text-[11px] uppercase tracking-wider text-graphite/60 font-medium">
                      <span>Индивидуальный расчет</span>
                      <span className="h-1 w-1 rounded-full bg-matteGold"></span>
                      <span>Без шаблонных прогнозов</span>
                    </div>
                  </div>

                  <div className="lg:col-span-5 relative flex justify-center">
                    <div className="relative w-full max-w-[340px] sm:max-w-[380px] aspect-[4/5] rounded-2xl overflow-hidden border border-graphite/10 bg-blushingBride shadow-2xl">
                      <img 
                        src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=800" 
                        alt="Консультация астролога Натальи Соболь: разбор натальной карты и соляр"
                        className="h-full w-full object-cover grayscale contrast-[1.08] hover:grayscale-0 transition-all duration-700"
                        decoding="async"
                      />
                      <div className="absolute inset-0 bg-gradient-to-t from-graphite/85 via-transparent to-transparent pointer-events-none" />
                      
                      <div className="absolute bottom-5 left-5 right-5 text-white">
                        <div className="flex items-center gap-2 text-matteGold mb-1">
                          <StarEight />
                          <span className="text-[10px] uppercase tracking-widest font-bold">Ориентир</span>
                        </div>
                        <p className="text-xs font-light leading-relaxed text-white/90">
                          Астрология не заменяет выбор: это детальная карта местности, где решение всегда за вами.
                        </p>
                      </div>
                    </div>
                  </div>

                </div>
              </div>
            </section>

            {/* БЛОК СТАТУСА И ДОВЕРИЯ */}
            <section id="about" className="border-b border-graphite/8 py-14 bg-[#F2EFE9]">
              <div className="mx-auto max-w-6xl px-6">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                  <div className="space-y-3">
                    <div className="flex items-center gap-3">
                      <div className="flex h-10 w-10 items-center justify-center rounded-2xl bg-white shadow-sm">
                        <ShieldIcon />
                      </div>
                      <h3 className="font-display text-base font-semibold text-graphite">Без абстрактных догм</h3>
                    </div>
                    <p className="text-sm text-graphite/70 leading-relaxed font-normal">
                      Четкий тайминг событий и математический анализ вероятностей вместо размытых гороскопов.
                    </p>
                  </div>

                  <div className="space-y-3">
                    <div className="flex items-center gap-3">
                      <div className="flex h-10 w-10 items-center justify-center rounded-2xl bg-white shadow-sm">
                        <TrendingIcon />
                      </div>
                      <h3 className="font-display text-base font-semibold text-graphite">Опора для решений</h3>
                    </div>
                    <p className="text-sm text-graphite/70 leading-relaxed font-normal">
                      Определение периодов максимальной отдачи в сделках, смене работы и инвестициях энергии.
                    </p>
                  </div>

                  <div className="space-y-3">
                    <div className="flex items-center gap-3">
                      <div className="flex h-10 w-10 items-center justify-center rounded-2xl bg-white shadow-sm">
                        <CalendarIcon />
                      </div>
                      <h3 className="font-display text-base font-semibold text-graphite">Конфиденциальность</h3>
                    </div>
                    <p className="text-sm text-graphite/70 leading-relaxed font-normal">
                      Индивидуальная работа без шаблонов и публичной огласки личных или коммерческих данных.
                    </p>
                  </div>
                </div>
              </div>
            </section>

            {/* АКЦЕНТНЫЙ БЛОК: FUCHSIA FEDORA (Бренд-цитата из мудборда) */}
            <section id="quote" className="py-14 bg-fuchsiaFedora text-white">
              <div className="mx-auto max-w-4xl px-6 text-center space-y-5">
                <div className="flex items-center justify-center gap-2 text-white/80">
                  <StarEight />
                  <span className="text-xs uppercase tracking-[0.24em] font-semibold text-white">
                    Стратегия, время, возможности
                  </span>
                  <StarEight />
                </div>
                <blockquote className="font-display text-2xl sm:text-3xl md:text-4xl font-bold leading-tight max-w-3xl mx-auto">
                  Видеть перспективу. Понимать риски. Использовать лучшие периоды.
                </blockquote>
                <div className="pt-2">
                  <p className="font-script text-2xl sm:text-3xl text-matteGold tracking-wide">
                    Наталья Соболь
                  </p>
                </div>
              </div>
            </section>

            {/* КАТАЛОГ УСЛУГ */}
            <section id="services" className="py-20 border-b border-graphite/8">
              <div className="mx-auto max-w-6xl px-6">
                
                <div className="flex flex-col md:flex-row md:items-end justify-between mb-10 gap-4">
                  <div>
                    <span className="text-xs uppercase tracking-[0.2em] font-bold text-matteGold">
                      Направления работы
                    </span>
                    <h2 className="font-display text-3xl sm:text-4xl font-bold text-graphite mt-2">
                      Прогнозы и персональные консультации
                    </h2>
                  </div>

                  {/* Фильтры */}
                  <div className="flex flex-wrap gap-2">
                    {[
                      { id: 'all', label: 'Все' },
                      { id: 'forecast', label: 'Прогнозы' },
                      { id: 'finance', label: 'Деньги' },
                      { id: 'relations', label: 'Отношения' },
                      { id: 'natal', label: 'Карта' },
                    ].map(f => (
                      <button
                        key={f.id}
                        onClick={() => setCategoryFilter(f.id)}
                        className={`rounded-2xl px-4 py-2 text-xs font-semibold uppercase tracking-wider transition-all ${
                          categoryFilter === f.id
                            ? 'bg-graphite text-white'
                            : 'bg-white text-graphite/70 border border-graphite/10 hover:border-graphite/30'
                        }`}
                      >
                        {f.label}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {filteredServices.map((item) => {
                    const IconComponent = item.icon;
                    return (
                      <div 
                        key={item.id}
                        className={`relative flex flex-col justify-between p-8 rounded-2xl border transition-all duration-300 ${
                          item.popular 
                            ? 'border-matteGold bg-white shadow-lg' 
                            : 'border-graphite/10 bg-white/80 hover:border-graphite/25'
                        }`}
                      >
                        <div>
                          <div className="flex items-center justify-between mb-6">
                            <span className="text-[11px] font-bold uppercase tracking-widest text-fanfareTeal px-3 py-1 rounded-2xl bg-blushingBride">
                              {item.tag}
                            </span>
                            <div className="h-9 w-9 rounded-2xl bg-ivory flex items-center justify-center">
                              <IconComponent />
                            </div>
                          </div>

                          <h3 className="font-display text-xl font-bold text-graphite mb-3">
                            {item.title}
                          </h3>

                          <p className="text-sm text-graphite/75 leading-relaxed mb-6 font-normal">
                            {item.desc}
                          </p>
                        </div>

                        <div className="border-t border-graphite/8 pt-6">
                          <div className="text-xs text-graphite/60 mb-4 flex items-center gap-2">
                            <span className="h-1.5 w-1.5 rounded-full bg-matteGold"></span>
                            {item.duration}
                          </div>

                          <div className="flex items-center justify-between">
                            <span className="font-display text-xl font-bold text-graphite">
                              {item.price}
                            </span>
                            <button 
                              onClick={() => handleOpenBooking(item.title)}
                              className="rounded-2xl bg-fanfareTeal px-5 py-2.5 text-xs uppercase font-bold tracking-wider text-white hover:bg-fanfareTeal/90 transition-colors active:scale-95"
                            >
                              Записаться
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>

              </div>
            </section>

            {/* СЕКЦИЯ КОНТАКТОВ */}
            <section id="contacts" className="py-20 bg-ivory">
              <div className="mx-auto max-w-4xl px-6 text-center space-y-6">
                <span className="text-xs uppercase tracking-[0.2em] font-bold text-matteGold">
                  Запись и обратная связь
                </span>
                <h2 className="font-display text-3xl sm:text-4xl font-bold text-graphite">
                  Определите свой следующий уверенный шаг
                </h2>
                <p className="text-base text-graphite/70 max-w-lg mx-auto font-normal">
                  Напишите в Telegram для уточнения деталей, выбора формата консультации или бронирования даты.
                </p>
                <div className="pt-2 flex flex-wrap justify-center gap-4">
                  <button 
                    onClick={() => handleOpenBooking()}
                    className="rounded-2xl bg-fanfareTeal px-8 py-3.5 text-xs font-bold uppercase tracking-widest text-white hover:bg-fanfareTeal/90 transition-all shadow-md active:scale-95"
                  >
                    Оставить заявку
                  </button>
                  <a 
                    href="https://t.me/astro_natasobol" 
                    target="_blank" 
                    rel="noreferrer"
                    className="inline-flex items-center gap-2 rounded-2xl border border-graphite/20 bg-white px-7 py-3.5 text-xs font-bold uppercase tracking-widest text-graphite hover:bg-graphite/5 transition-all"
                  >
                    Написать в Telegram
                  </a>
                </div>
              </div>
            </section>
          </main>

          {/* ПОДВАЛ */}
          <footer className="border-t border-graphite/10 bg-[#F2EFE9] py-12 text-graphite/60 text-xs">
            <div className="mx-auto max-w-6xl px-6 flex flex-col md:flex-row items-center justify-between gap-6">
              <div className="flex flex-col items-center md:items-start">
                <span className="font-display font-bold tracking-widest text-graphite uppercase">Наталья Соболь</span>
                <span className="text-[11px] mt-1 text-graphite/60">Индивидуальное астрологическое консультирование</span>
              </div>

              <div className="flex gap-6 tracking-wider uppercase text-[11px] font-semibold">
                <a href="#" className="hover:text-graphite">Договор оферты</a>
                <a href="#" className="hover:text-graphite">Политика конфиденциальности</a>
                <a href="https://t.me/astro_natasobol" className="hover:text-graphite">Telegram-канал</a>
              </div>

              <p className="text-[11px] text-graphite/50">
                © 2026 Все права защищены.
              </p>
            </div>
          </footer>

          {/* МОДАЛЬНОЕ ОКНО ЗАПИСИ */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-graphite/60 backdrop-blur-sm">
              <div className="relative w-full max-w-md rounded-2xl bg-ivory p-8 border border-graphite/10 shadow-2xl">
                <button 
                  onClick={() => setIsModalOpen(false)}
                  className="absolute top-6 right-6 text-graphite/60 hover:text-graphite text-lg"
                >
                  ✕
                </button>

                {formSent ? (
                  <div className="py-8 text-center space-y-3">
                    <div className="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-blushingBride text-fanfareTeal">
                      ✓
                    </div>
                    <h3 className="font-display text-lg font-bold text-graphite">Заявка принята</h3>
                    <p className="text-xs text-graphite/70">
                      Наталья свяжется с вами в Telegram или WhatsApp в течение рабочего дня.
                    </p>
                  </div>
                ) : (
                  <div>
                    <span className="text-[10px] uppercase font-bold tracking-widest text-matteGold">
                      Запись на консультацию
                    </span>
                    <h3 className="font-display text-xl font-bold text-graphite mt-1 mb-6">
                      Укажите ваши данные
                    </h3>

                    <form onSubmit={handleFormSubmit} className="space-y-4">
                      <div>
                        <label className="block text-[11px] uppercase tracking-wider text-graphite/60 mb-1 font-semibold">
                          Формат разбора
                        </label>
                        <select 
                          value={selectedService} 
                          onChange={(e) => setSelectedService(e.target.value)}
                          className="w-full rounded-2xl border border-graphite/15 bg-white px-4 py-2.5 text-xs text-graphite focus:outline-none focus:border-matteGold"
                        >
                          {services.map(s => (
                            <option key={s.id} value={s.title}>{s.title}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-[11px] uppercase tracking-wider text-graphite/60 mb-1 font-semibold">
                          Ваше имя
                        </label>
                        <input 
                          type="text" 
                          required 
                          placeholder="Имя"
                          className="w-full rounded-2xl border border-graphite/15 bg-white px-4 py-2.5 text-xs text-graphite focus:outline-none focus:border-matteGold"
                        />
                      </div>

                      <div>
                        <label className="block text-[11px] uppercase tracking-wider text-graphite/60 mb-1 font-semibold">
                          Telegram или WhatsApp
                        </label>
                        <input 
                          type="text" 
                          required 
                          placeholder="@username или телефон"
                          className="w-full rounded-2xl border border-graphite/15 bg-white px-4 py-2.5 text-xs text-graphite focus:outline-none focus:border-matteGold"
                        />
                      </div>

                      <p className="text-[10px] text-graphite/50 leading-snug">
                        Отправляя заявку, вы соглашаетесь на обработку персональных данных.
                      </p>

                      <button 
                        type="submit"
                        className="w-full rounded-2xl bg-fanfareTeal py-3 text-xs font-bold uppercase tracking-widest text-white hover:bg-fanfareTeal/90 transition-all active:scale-95"
                      >
                        Подтвердить запись
                      </button>
                    </form>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NataliaSobolApp />);
  </script>
</body>
</html>
